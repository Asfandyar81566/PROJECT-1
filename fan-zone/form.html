<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Zone</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav>
        <a href="/PROJECT-1/index.html">Home</a>
        <a href="/PROJECT-1/menu/football_legends.html">Legends</a>
        <a href="/PROJECT-1/menu/majorclubs.html">Clubs</a>
        <a href="/PROJECT-1/menu/majortrophies.html">Trophies</a>
        <a href="/PROJECT-1/player_stats/statistics.html">Stats</a>
        <a href="/PROJECT-1/news/fake-news.html">News</a>
        <a href="#">Gallery</a>
        <a href="/PROJECT-1/fan-zone/form.html">Fan Zone</a>
    </nav>
    <form action="">
        <div>
            <label for="name">Name</label>
            <input type="text" name="name" id="name" placeholder="Enter Your Name">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Enter Your Email Id">
        </div>
        <div>
            <label for="fav_player">Favourite Player</label>
            <input type="text" name="favourite_player" id="fav_player" placeholder="Enter your fav player name">
        </div>
        <div>
            <label for="fav_club">Favourite Club</label>
            <input type="text" name="favourite_club" id="fav_club" placeholder="Enter your favourite club">
        </div>
        <div>
            <label for="fav_position">Favourite Position</label>
            <select name="favourite_position" id="fav_position">
                <option value="" selected disabled>Select Favourite Position</option>
                <option value="GK">GK</option>
                <option value="CB">CB</option>
                <option value="LB / RB">LB / RB</option>
                <option value="CDM">CDM</option>
                <option value="CAM">CAM</option>
                <option value="LW / RW">LW / RW</option>
                <option value="CM">CM</option>
                <option value="ST">ST</option>
                <option value="CF">CF</option>
            </select>
        </div>
        <div>
            <label for="choice">GOAT Choice</label>
            <select name="goat choice" id="choice">
                <option value="" selected disabled>GOAT Choice</option>
                <option value="Ronaldo">Ronaldo</option>
                <option value="Messi">Messi</option>
            </select>
        </div>
        <div>
            <label for="experience">Football experience/opinion</label>
            <textarea name="football_experience" id="experience" rows="4"></textarea>
        </div>

        <label for="greatest_footballer">"Who is the Greatest Footballer of All Time?"</label>
        <select name="greatest_footballer_of_all_time" id="greatest_footballer">
            <option value="" selected disabled>Greatest Footballer</option>
            <option value="ronaldo">Cristiano Ronaldo</option>
            <option value="messi">Lionel Messi</option>
            <option value="pelé">Pelé</option>
            <option value="maradona">Diego Maradona</option>
            <option value="other">Other</option>
        </select><br>
        <button>Submit</button>
    </form>
    <script src="../js/script.js"></script>

</body>

</html>
